<div cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container">
    <div mat-dialog-title class="dialog-title" cdkDragHandle>
        <h2>{{data.title}} - ({{data.query_id}})</h2>
        <div class="btnIcon">
            <button mat-icon-button title="Minimize" (click)="minimize()">
                <mat-icon>remove</mat-icon>
            </button>
            <button mat-icon-button title="Restore Down" (click)="maximize()" *ngIf="__isVisible">
                <mat-icon>check_box_outline_blank</mat-icon>
            </button>
            <button mat-icon-button title="Maxiize" (click)="fullScreen()" *ngIf="!__isVisible">
                <mat-icon>content_copy</mat-icon>
            </button>

            <button mat-icon-button title="Close" [mat-dialog-close]="">
                <mat-icon>close</mat-icon>
            </button>

        </div>

    </div>
    <mat-dialog-content class="p-5">
                    <form [formGroup]="tatRmks" id="tatRmks_{{data.trxn.id}}" (ngSubmit)="submitTATS()">
                            <div class="row">
                                <div class="col-sm-12">
                                    <label for="tat_remarks">TAT Remarks <span class="text-danger">*</span></label>
                                    <textarea   id="tat_remarks" name="tat_remarks" rows="4" class="form-control" formControlName="tat_remarks" placeholder="Enter Remarks" cols="12"></textarea>
                                    <div class="invalid-feedback" *ngIf="tatRmks.get('tat_remarks').invalid && (tatRmks.get('tat_remarks').dirty || tatRmks.get('tat_remarks').touched)">
                                        <span class="invalid-feedback" *ngIf="(tatRmks.get('tat_remarks').errors?.required)">*Please provide TAT Remarks</span>
                                      </div>    
                                </div>
                            </div>   
                    </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end" cdkDragHandle class="popupBoxSubmitSec">
        <button class="btn addBtn  ml-2" [attr.form]="'tatRmks_'+data.trxn.id" [disabled]="this.tatRmks.invalid">
          {{this.data.id > 0 ? 'Update' : 'Submit'}}
        </button>
      </mat-dialog-actions>
</div>
