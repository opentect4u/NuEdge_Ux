<div class="flexSec">
    <div class="container">
        <mat-card class="mat-elevation-z0  border">
            <mat-card-header class="border-bottom">
                <mat-card-title><h4 class="filterHeader">AUM By Branch Report</h4></mat-card-title>
                <div class="pr-3 my-auto d-flex align-items-center">
                  <p-selectButton [(ngModel)]="btn_type" [options]="selectBtn" optionValue="value" styleClass="p-button-lg"
                    (onOptionClick)="onItemClick($event)" optionLabel="icon">
                    <ng-template let-item>
                      <i [class]="item.icon" [matTooltip]="item.label"></i>
                    </ng-template>
                  </p-selectButton>
                </div>
              </mat-card-header>
            <mat-card-content class="p-3">
                <!-- Filter Criteria -->
                <form [formGroup]="aum_report_filter_frm" (ngSubmit)="clickToSend()">
                    <div class="row">
                        <div class="col-sm-3">
                            <label for="date">Date</label>
                            <p-calendar #dateRng dateFormat="dd/mm/yy"
                              placeholder="Select Date" formControlName="date"
                              [readonlyInput]="true" [id]="'date'" [showIcon]="true" [hideOnDateTimeSelect]="true"
                              [showButtonBar]="true">
                            </p-calendar>
                          </div>
                          <div class="col-sm-3">
                            <label for="brn_cd">Branch</label>
                            <ng-multiselect-dropdown #multiSelect id="brn_cd" [placeholder]="'Select Branch'"
                              [settings]="settingsforBrnchDropdown" [data]="branchMst"
                              formControlName="brn_cd">
                            </ng-multiselect-dropdown>
                          </div>
                          <ng-container *ngIf="btn_type == 'A'">
                            <!-- <div class="row"> -->
                              <!-- <ng-container> -->
                                
                                <div class="col-sm-3">
                                  <label for="bu_type">Business Type</label>
                                  <ng-multiselect-dropdown #multiSelect id="bu_type" [placeholder]="'Select Business Type'"
                                     [settings]="settingsforBuTypeDropdown" [data]="bu_type"
                                    formControlName="bu_type_id">
                                  </ng-multiselect-dropdown>
                                </div>
                                <div class="col-sm-3">
                                  <label for="rm_name">Relationship Manager</label>
                                  <ng-multiselect-dropdown #multiSelect id="rm_name" [placeholder]="'Select Relationship Manager'"
                                   [settings]="settingsforRMDropdown" [data]="RmMst"
                                    formControlName="rm_id">
                                  </ng-multiselect-dropdown>
                                </div>
                                <div class="col-sm-3">
                                  <label for="sub_brk_cd">Sub Broker</label>
                                  <ng-multiselect-dropdown #multiSelect [id]="'sub_brk_cd'" [placeholder]="'Select Sub Broker'"
                                   [settings]="settingsforSubBrkDropdown"
                                    [data]="subbrkArnMst" formControlName="sub_brk_cd">
                                  </ng-multiselect-dropdown>
                                </div>
                                <div class="col-sm-3">
                                  <label for="euin_no">EUIN</label>
                                  <ng-multiselect-dropdown #multiSelect id="euin_no" [placeholder]="'Select Employee'"
                                    [settings]="settingsforEuinDropdown" [data]="euinMst" formControlName="euin_no">
                                  </ng-multiselect-dropdown>
                                </div>
                          </ng-container>
                          <div  class="d-flex col-sm-6 justify-content-end align-items-end">
                                <p-button type="submit" label="Show" icon="pi pi-eye" iconPos="right" styleClass="p-button-lg"></p-button>
                          </div>
                    </div>
                </form>
                <!-- End -->

                <!-- <ng-container *ngIf="md_aum_by_branch.length > 0"> -->
                    <aum-table [dataSource]="md_aum_by_branch" 
                    [footerDT]="footerDT"  
                    [column]="aum_branch_Column"
                    [__formDate]="__formDate"></aum-table>
                <!-- </ng-container> -->
        
            </mat-card-content>
        </mat-card>
        
    </div>
</div>
