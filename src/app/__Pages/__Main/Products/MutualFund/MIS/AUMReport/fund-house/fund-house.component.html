
<div class="flexSec">
    <div class="container">
        <!-- [aum_type]="aum_type" -->
        
        <ng-container *ngIf="!hasParams">
            <aum-filter (onPress)="getFormData($event)"></aum-filter>
        </ng-container>
        <ng-container *ngIf="md_fundHouse.length > 0">
            <aum-table [dataSource]="md_fundHouse" 
            [column]="fund_House_Column"
            [subColumn]="fund_house_sub_column"
            [__formDate]="__formDate"
            [footerDT]="footerDT"
            ></aum-table>
        </ng-container>
    </div>
</div>
