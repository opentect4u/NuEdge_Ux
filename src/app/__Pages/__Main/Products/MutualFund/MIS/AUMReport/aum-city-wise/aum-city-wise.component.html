
<div class="flexSec">
    <div class="container">
        <aum-filter [md_cityTtpe]="md_cityTtpe" (onPress)="getFormData($event)"></aum-filter>
        <ng-container *ngIf="md_aum_city_type.length > 0">
            <aum-table [dataSource]="md_aum_city_type" 
            [footerDT]="footerDT"  
            [dataKey]="'id'"
            [__formDate]="__formDate"
            [column]="aum_client_Column"
            ></aum-table>
        </ng-container>
    </div>
</div>
