<div class="flexSec">
    <div class="container">
        <mat-card class="mat-elevation-z0  border">
            <mat-card-header class="border-bottom">
                <mat-card-title><h4 class="filterHeader">AUM By Segment Report</h4></mat-card-title>
                <div class="pr-3 my-auto d-flex align-items-center"></div>
              </mat-card-header>
            <mat-card-content class="p-3">
                <!-- Filter Criteria -->
                <form [formGroup]="aum_report_filter_frm" (ngSubmit)="clickToSend()">
                    <div class="row">
                        <div class="col-sm-3">
                            <label for="date">Date</label>
                            <p-calendar #dateRng dateFormat="dd/mm/yy"
                              placeholder="Select Date" formControlName="date"
                              [readonlyInput]="true" [id]="'date'" [showIcon]="true" [hideOnDateTimeSelect]="true"
                              [showButtonBar]="true">
                            </p-calendar>
                          </div>
                          <div class="col-sm-3">
                            <label for="bu_type_id">Segment</label>
                            <select class="form-control" formControlName="bu_type_id"  id="bu_type_id" name="bu_type_id">
                                <option value=""> Select Segment</option>
                                <option *ngFor="let __bu_type of md_buisnessType" value="{{__bu_type.id}}">{{__bu_type.bu_type}}</option>

                                <!-- <option value="D">Direct</option>
                                <option value="I">Indirect B2C</option>
                                <option value="B">Indirect B2B</option> -->
                            </select>    
                          </div>
                          <div  class="d-flex col-sm-6 justify-content-end align-items-end">
                                <p-button type="submit" label="Show" icon="pi pi-eye" iconPos="right" styleClass="p-button-lg"></p-button>
                          </div>
                    </div>
                </form>
                <!-- End -->

                <ng-container *ngIf="md_aum_by_segment.length > 0">
                    <aum-table [dataSource]="md_aum_by_segment" 
                    [footerDT]="footerDT"  
                    [column]="aum_segment_Column"
                    [__formDate]="__formDate"></aum-table>
                </ng-container>
        
            </mat-card-content>
        </mat-card>
        
    </div>
</div>
