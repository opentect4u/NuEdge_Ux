

<div class="card">
  <div class="card-body p-3">
      <div class="text-left p-1 " >
          <span class="cardHeading">Create Client by Entry</span>
      </div>
      <div class="bottomBorderLine"></div>
      <div class="row">
          <div class="col-7 mx-auto">
            <form [formGroup]="customer_entry_form" id="createClient" (ngSubmit)="submitForm()">
              <div class="form-group row">
                <label for="tax_status" class="col-sm-4 col-form-label m-0 labelTitle">Tax Status:</label>
                <div class="col-sm-5">
                  <select id="tax_status" name="tax_status" class="js-example-responsive select2 w-100 form-control" formControlName="tax_status">
                    <option value="">-- Choose Tax Status --</option>
                    <option value="{{status.id}}" *ngFor="let status of md_taxStatus">{{status.tax_name}}</option>
                  </select>
                  <span class="text-danger error_txt"
                  *ngIf=" customer_entry_form.get('tax_status').invalid && (customer_entry_form.get('tax_status').dirty || customer_entry_form.get('tax_status').touched)">
                  **Tax status is required**
              </span>
                </div>
              </div>
              <div class="form-group row">
                <label for="mode_of_holding" class="col-sm-4 col-form-label m-0 labelTitle">Holding Nature:</label>
                <div class="col-sm-5">
                  <select id="mode_of_holding" name="mode_of_holding" class="js-example-responsive select2 w-100 form-control"
                    formControlName="mode_of_holding">
                    <option value="">-- Choose Holding Nature --</option>
                    <!-- <option value="A">ANYONE / SURVIVOR</option>
                    <option value="J">JOINT</option>
                    <option value="S">SINGLE</option> -->
                    <option value="{{mode_of_holding.id}}" *ngFor="let mode_of_holding of md_clientHolding">{{mode_of_holding.name}}</option>

                  </select>
                  <span class="text-danger error_txt"
                  *ngIf=" customer_entry_form.get('mode_of_holding').invalid && (customer_entry_form.get('mode_of_holding').dirty || customer_entry_form.get('mode_of_holding').touched)">
                  **Holding Nature is required**
              </span>
                </div>
              </div>
            </form>

          </div>
      </div>

  </div>
  <div class="card-footer text-center">
          <button [disabled]="customer_entry_form.invalid" type="submit" form="createClient" class="btn btn-primary mx-3">
            <i class="pi pi-plus mr-1"></i>
                  Create
          </button>
          <button type="reset" form="createClient" (click)="resetForm()"  class="btn btn-danger">
            <i class="pi pi-refresh mr-1"></i>

              Reset
          </button>
  </div>
</div>
